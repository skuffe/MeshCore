[rak3401]
extends = nrf52_base
board = rak3401
board_check = true
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak3401
  -D RAK_3401
  -D NRF52_POWER_MANAGEMENT
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX with SKY66122 FEM
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak3401>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27

[env:RAK_3401_repeater]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 1W Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>

; Repeater + BLE-NUS console backhaul for the mast — the RAK3401 (WisMesh 1W
; Booster, SKY66122 FEM) build of the same role as RAK_4631_repeater_ble_gw.
; The mast hardware is a RAK3401, NOT a RAK4631: building the rak4631 variant for
; it hangs at boot (wrong radio/FEM init). Vendored main.cpp + BleConsole; the
; console packet feed rides the logRx/logTx hooks via PACKET_LOG_STREAM
; (Dispatcher stays pristine), so MESH_PACKET_LOGGING is intentionally NOT set.
[env:RAK_3401_repeater_ble_gw]
extends = env:RAK_3401_repeater
build_flags =
  ${env:RAK_3401_repeater.build_flags}
  -I examples/simple_repeater   ; vendored main.cpp finds MyMesh.h / UITask.h here
  ; Node role: mast observer. ObserverRoles.h derives the capability flags
  ; (WITH_OBSERVER + WITH_BACKHAUL_PERIPHERAL) from this; -include applies the map to
  ; every TU. Add a role there, not a pile of -D WITH_* here.
  -D ROLE_OBSERVER_MAST
  -include ${platformio.src_dir}/helpers/ObserverRoles.h
  -D BLE_TX_POWER=8
  -D BLE_CONSOLE_NAME='"MeshCore-RPT"'
  -D PACKET_LOG_STREAM=BleConsole
  -D PACKET_LOG_STREAM_HEADER='"helpers/nrf52/BleConsole.h"'
  ; Build identity for `ver`: FIRMWARE_VERSION = concise semantic version (also
  ; used in the advert). The unique per-build id (git describe + UTC stamp) is
  ; injected into FIRMWARE_BUILD_DATE by build_id.py (nrf52_base extra_scripts).
  -D FIRMWARE_VERSION='"v1.16.0"'
  ; Feed/role map: BLE NUS (BleConsole) carries BOTH the CLI/admin console and the
  ; PACKET_LOG_STREAM packet feed (single transport on the mast). cliext adds the
  ; backhaul/log commands; eth/tcpota/mqtt compile out (no WITH_RAK13800_ETHERNET /
  ; WITH_NET_BRIDGE in the ROLE_OBSERVER_MAST capability set).
build_src_filter = ${env:RAK_3401_repeater.build_src_filter}
  -<../examples/simple_repeater/main.cpp>
  +<apps/repeater_ble_gw/main.cpp>
  +<helpers/nrf52/BleConsole.cpp>
  +<helpers/Observer.cpp>
  +<helpers/console/CLIExtensions.cpp>
  +<helpers/console/CliextConfig.cpp>

[env:RAK_3401_room_server]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Test Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>

[env:RAK_3401_companion_radio_usb]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak3401.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_companion_radio_ble]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak3401.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_terminal_chat]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_sensor]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_sensor>

[env:RAK_3401_kiss_modem]
extends = rak3401
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/kiss_modem/>
