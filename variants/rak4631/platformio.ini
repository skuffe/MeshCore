;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rak4631.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>

; Room server + MQTT observer for the RAK WisMesh Ethernet Gateway (RAK10720):
; packet logging enabled, console (CLI + packet logs) mirrored on TCP port 5000
; via the RAK13800 W5100S ethernet module.
[env:RAK_4631_room_server_eth_gw]
extends = env:RAK_4631_room_server
build_flags =
  ${env:RAK_4631_room_server.build_flags}
  -UNRF52_POWER_MANAGEMENT   ; PoE gateway: never deep-sleep — idle draw must stay
                             ; above the 802.3af/at maintain-power floor or the
                             ; switch cuts PoE. (Battery roles keep power mgmt.)
;  -D MESH_DEBUG=1
  ; Console packet feed is emitted from the logRx/logTx hooks via PACKET_LOG_STREAM
  ; (Dispatcher stays pristine), so MESH_PACKET_LOGGING is intentionally NOT set —
  ; it would only add a redundant duplicate copy on USB Serial.
  ; Node role: eth gateway. ObserverRoles.h derives WITH_OBSERVER + WITH_RAK13800_ETHERNET
  ; + WITH_NET_BRIDGE from this. The _blerelay child promotes it to ROLE_RELAY_GATEWAY.
  -D ROLE_ETH_GATEWAY
  -include ${platformio.src_dir}/helpers/ObserverRoles.h
  -D PACKET_LOG_STREAM=EthConsole
  -D PACKET_LOG_STREAM_HEADER='"helpers/bridges/EthernetTcpConsole.h"'
  ; Build identity for `ver`: real compile date + observer fork tag (see rak3401).
  -D FIRMWARE_VERSION='"v1.16.0-obs"'
  -D FIRMWARE_BUILD_DATE=__DATE__
  ; Feed/role map (this role): TCP :5000 (EthConsole) carries CLI/admin AND the
  ; PACKET_LOG_STREAM feed; the _blerelay child adds TCP :5001 for the mast's feed.
  ; cliext exposes start tcpota / eth / log here (backhaul compiles in via the child).
; The whole room-server role app is vendored under src/apps/room_server/ (main +
; MyMesh + UITask) so examples/simple_room_server/ stays 100% pristine upstream
; and rebases never conflict there. Sync drift with `make vendor-diff`.
build_src_filter = ${env:RAK_4631_room_server.build_src_filter}
  -<../examples/simple_room_server>
  +<apps/room_server>
  +<helpers/bridges/EthernetTcpConsole.cpp>
  +<helpers/bridges/MqttPublisher.cpp>
  +<helpers/bridges/ObserverJson.cpp>
  +<helpers/bridges/NtpClient.cpp>
  +<helpers/console/CLIExtensions.cpp>
  +<helpers/console/CliextConfig.cpp>
lib_deps =
  ${rak4631.lib_deps}
  https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.2.zip
  256dpi/MQTT@^2.5

; Room server + ethernet observer + BLE-central relay. In addition to its own
; console on :5000, runs a BLE central that connects to the mast repeater's BLE
; NUS and bridges it to TCP :5001 for a second mcbridge instance (mast identity).
[env:RAK_4631_room_server_eth_gw_blerelay]
extends = env:RAK_4631_room_server_eth_gw
build_flags =
  ${env:RAK_4631_room_server_eth_gw.build_flags}
  ; Promote the eth gateway to the relay gateway role: ObserverRoles.h adds
  ; WITH_BACKHAUL_CENTRAL on top of the inherited ROLE_ETH_GATEWAY caps.
  -D ROLE_RELAY_GATEWAY
  -D BLE_RELAY_PORT=5001
  -D BLE_TX_POWER=8
  -D BLE_RELAY_TARGET_NAME='"MeshCore-RPT"'
; Inherits the vendored main.cpp + -I from RAK_4631_room_server_eth_gw; the
; WITH_BACKHAUL_CENTRAL block in it activates here. Just add the relay source.
build_src_filter = ${env:RAK_4631_room_server_eth_gw.build_src_filter}
  +<helpers/bridges/BleNusRelay.cpp>

[env:RAK_4631_companion_radio_usb]
extends = rak4631
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
