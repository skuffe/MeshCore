[rak4631]
extends = nrf52_base
board = rak4631
board_check = true
extra_scripts = ${nrf52_base.extra_scripts}
  post:variants/rak4631/fix_bsec_lib.py
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak4631
  -D RAK_4631
  -D RAK_BOARD
  -D NRF52_POWER_MANAGEMENT
  -D PIN_BOARD_SCL=14
  -D PIN_BOARD_SDA=13
  -D PIN_GPS_TX=PIN_SERIAL1_RX
  -D PIN_GPS_RX=PIN_SERIAL1_TX
  -D PIN_GPS_EN=-1
  -D PIN_OLED_RESET=-1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ENV_INCLUDE_RAK12035=1
  -UENV_INCLUDE_BME680
  -D ENV_INCLUDE_BME680_BSEC=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak4631>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27
  boschsensortec/BSEC Software Library @ ^1.8.1492

[env:RAK_4631_repeater]
extends = rak4631
build_flags =
  ${rak4631.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK4631 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rak4631.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>

; Repeater + BLE-NUS console backhaul for the mast node: packet logs (and the
; CLI) shipped over a BLE Nordic-UART peripheral so a co-located BLE-central
; relay can consume them. Native BLE DFU is retained — bledfu is registered at
; boot and `start ota` hands off via the WITH_BACKHAUL_PERIPHERAL guard in NRF52Board.
[env:RAK_4631_repeater_ble_gw]
extends = env:RAK_4631_repeater
build_flags =
  ${env:RAK_4631_repeater.build_flags}
  -I examples/simple_repeater   ; vendored main.cpp finds MyMesh.h / UITask.h here
  ; Console packet feed is emitted from the logRx/logTx hooks via PACKET_LOG_STREAM
  ; (Dispatcher stays pristine), so MESH_PACKET_LOGGING is intentionally NOT set —
  ; it would only add a redundant duplicate copy on USB Serial.
  ; Node role: mast observer (RAK4631 variant). See helpers/ObserverRoles.h.
  -D ROLE_OBSERVER_MAST
  -include ${platformio.src_dir}/helpers/ObserverRoles.h
  -D BLE_TX_POWER=8
  -D BLE_CONSOLE_NAME='"MeshCore-RPT"'
  -D PACKET_LOG_STREAM=BleConsole
  -D PACKET_LOG_STREAM_HEADER='"helpers/nrf52/BleConsole.h"'
  ; Build identity for `ver`: override upstream's hardcoded FIRMWARE_BUILD_DATE so
  ; custom builds report the real compile date + observer fork tag (see rak3401).
  -D FIRMWARE_VERSION='"v1.16.0-obs"'
  -D FIRMWARE_BUILD_DATE=__DATE__
  ; Feed/role map: BLE NUS (BleConsole) carries BOTH the CLI/admin console and the
  ; PACKET_LOG_STREAM packet feed (single transport on the mast). cliext adds the
  ; backhaul/log commands; eth/tcpota/mqtt compile out (not in the ROLE_OBSERVER_MAST
  ; capability set).
build_src_filter = ${env:RAK_4631_repeater.build_src_filter}
  -<../examples/simple_repeater/main.cpp>
  +<apps/repeater_ble_gw/main.cpp>
  +<helpers/nrf52/BleConsole.cpp>
  +<helpers/console/CLIExtensions.cpp>
  +<helpers/console/CliextConfig.cpp>

